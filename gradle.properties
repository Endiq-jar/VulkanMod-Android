# Increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ------------------------------------------------------------------
# Fabric / Minecraft properties
#
# This project tracks the `dev` branch of xCollateral/VulkanMod
# (the latest Minecraft version). To build for a different Minecraft
# version, use the version-matrix script (scripts/build-version.sh)
# or GitHub Actions workflow (.github/workflows/build.yml), which
# checks out the matching upstream branch, applies the Android patch
# and builds it. See "Version matrix" in the README.
# ------------------------------------------------------------------
minecraft_version = 1.21.11
yarn_mappings = 1.21.11+build.2
loader_version = 0.18.4

# Fabric API
fabric_version = 0.140.0+1.21.11

# Mod properties
mod_version = 0.6.8+1.21.11-dev-android
maven_group = net.vulkanmod
archives_base_name = VulkanMod-Android
