name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Gradle 7.4 + Java 17 (older renderer generations)
          - { branch: "1.18.2", java: 17 }
          - { branch: "1.19.2", java: 17 }
          - { branch: "1.19.4", java: 17 }
          # Gradle 8.5/8.7/9.x + Java 21 (modern renderer generations)
          - { branch: "1.20.x", java: 21 }
          - { branch: "1.21", java: 21 }
          - { branch: "dev", java: 21 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build (${{ matrix.branch }})
        run: scripts/build-version.sh "${{ matrix.branch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Android-${{ matrix.branch }}
          path: |
            build/libs/*.jar
          if-no-files-found: warn
