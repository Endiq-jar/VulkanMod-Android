name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        branch: [ "1.19.4", "1.20.x", "1.21", "dev" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build (${{ matrix.branch }})
        run: scripts/build-version.sh "${{ matrix.branch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Android-${{ matrix.branch }}
          path: |
            build/libs/*.jar
          if-no-files-found: warn
