name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { branch: "1.18.2", java: 17 }
          - { branch: "1.19.2", java: 17 }
          - { branch: "1.19.4", java: 17 }
          - { branch: "1.20.x", java: 21 }
          - { branch: "1.21", java: 21 }
          - { branch: "dev", java: 21 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build (${{ matrix.branch }})
        run: scripts/build-version.sh "${{ matrix.branch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulkanMod-Android-${{ matrix.branch }}
          path: build/libs/*.jar
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.jar
